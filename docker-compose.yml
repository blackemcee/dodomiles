services:
  postgres:
    image: postgres:17-alpine
    container_name: dodomiles-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: dodomiles
      POSTGRES_PASSWORD: dodomiles
      POSTGRES_DB: dodomiles
    ports:
      - "5433:5432"
    volumes:
      - dodomiles_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dodomiles -d dodomiles"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  dodomiles_pg_data:
